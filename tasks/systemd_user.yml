---
- name: Reload systemd user daemon (rootless)
  become: true
  become_user: "{{ ivly_podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ ivly_xdg_runtime_dir }}"
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user

- name: Enable and start CouchDB container (rootless)
  become: true
  become_user: "{{ ivly_podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ ivly_xdg_runtime_dir }}"
  ansible.builtin.systemd_service:
    name: ivly-couchdb.service
    enabled: true
    state: started
    scope: user

- name: Enable and start validation container (rootless)
  become: true
