---
- name: Reload systemd user daemon
  become: true
  become_user: "{{ ivly_podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ ivly_xdg_runtime_dir }}"
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user

- name: Handle CouchDB changes
  ansible.builtin.include_tasks: couchdb_changes.yml

- name: Handle validation changes
  ansible.builtin.include_tasks: validation_changes.yml

- name: Handle printer changes
  ansible.builtin.include_tasks: printer_changes.yml

- name: Handle ivly-api changes
  ansible.builtin.include_tasks: ivly_api_changes.yml

- name: Handle ivly-backoffice changes
  ansible.builtin.include_tasks: ivly_backoffice_changes.yml

- name: Handle Caddy changes
  ansible.builtin.include_tasks: caddy_changes.yml
